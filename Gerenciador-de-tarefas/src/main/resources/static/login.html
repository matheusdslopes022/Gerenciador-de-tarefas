<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TaskFlow</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>
    <button type="button" id="botao-tema" class="btn-tema">🌙 Modo escuro</button>
    <div class="login-container">
        <section class="lado-marca">
            <svg class="wave-bg" viewBox="0 0 500 150" preserveAspectRatio="none">
                <path d="M 0 0 C 150 150 350 0 500 150 L 500 0 Z" fill="#22c55e" opacity="0.15"></path>
                <path d="M 0 0 C 200 100 300 0 500 80 L 500 0 Z" fill="#16a34a" opacity="0.3"></path>
                <path d="M 150 0 C 300 120 400 20 500 60 L 500 0 Z" fill="#15803d" opacity="0.5"></path>
            </svg>
            <div class="logo">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2d6a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                <div><h1>TaskFlow</h1><p>Gerenciador de Tarefas</p></div>
            </div>
            <div class="frase">
                <img src="img/foguete.png" alt="Foguete">
                <p>Grandes objetivos são construídos com pequenas tarefas.</p>
            </div>
        </section>

        <section class="lado-form">
            <h2 id="titulo">Bem-vindo de volta!</h2>
            <p class="subtitulo" id="subtitulo">Entre para ver suas tarefas.</p>

            <form id="form-login" novalidate>
                <div class="form-group" id="grupo-nome" hidden>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@email.com">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
                </div>
                <p class="mensagem" id="mensagem"></p>
                <button type="submit" class="btn-entrar" id="botao-enviar">Entrar</button>
            </form>

            <p class="trocar">
                <span id="texto-trocar">Ainda não tem conta?</span>
                <button type="button" id="botao-trocar">Cadastre-se</button>
            </p>
        </section>
    </div>
</body>
</html>
